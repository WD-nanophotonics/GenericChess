[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "generic-chess"
version = "0.8.0a6"
description = "Deterministic generic chess/shogi-like game engine: core kernel, RuleSet compiler, and generator."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]
gui = ["PySide6>=6.6,<7"]

[project.scripts]
generic-chess-ui = "generic_chess.ui.app:main"

[tool.setuptools.packages.find]
include = ["generic_chess*"]

[tool.setuptools.ext-modules]
"generic_chess._native_core" = { sources = [
  "generic_chess/_native/native_module.c",
  "generic_chess/_native/native_rules.c",
  "generic_chess/_native/native_state.c",
  "generic_chess/_native/native_hash.c",
  "generic_chess/_native/native_attack.c",
  "generic_chess/_native/native_movegen.c",
  "generic_chess/_native/native_perft.c",
  "generic_chess/_native/native_eval.c",
  "generic_chess/_native/native_search.c",
  "generic_chess/_native/native_tt.c",
  "generic_chess/_native/native_clock.c",
  "generic_chess/_native/native_cancel.c",
], optional = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
