[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "generic-chess"
version = "0.3.0"
description = "Deterministic generic chess/shogi-like game engine: core kernel, RuleSet compiler, and generator."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]
gui = ["PySide6>=6.6,<7"]

[project.scripts]
generic-chess-ui = "generic_chess.ui.app:main"

[tool.setuptools.packages.find]
include = ["generic_chess*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
